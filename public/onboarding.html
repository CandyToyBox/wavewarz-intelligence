<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to WaveWarz</title>
<meta name="description" content="A short guided start with DJ Wavy for traders, artists and hosts. Learn how a WaveWarz battle works, get a wallet, and jump in.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
:root{--bg:#0d1321;--bg-raised:#111a2e;--stage:#020202;--line:#daecfd24;--ink:#daecfd;--ink-muted:#989898;--green:#95fe7c;--green-ink:#95fe7c;--on-green:#0d1321;--blue:#7ec1fb;--blue-ink:#7ec1fb;--on-blue:#0d1321;--wave-white:#eef6f2;--wave-aqua:#5fd3c1;--wave-lime:#c4d457;--wave-sodium:#e5c25a;--wave-oxide:#842f22;--danger:#ff8a7a;--focus:#95fe7c;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:72px;--space-9:120px;--radius-sm:4px;--radius-md:10px;--radius-lg:18px;--radius-xl:32px;--radius-pill:999px;--glow-green:0 0 24px #95fe7c40;--glow-blue:0 0 24px #7ec1fb40;--lift:0 12px 32px #00000066;--dur-fast:140ms;--dur-base:240ms;--dur-slow:480ms;--dur-wave:4000ms;--ease-out:cubic-bezier(0.22, 1, 0.36, 1);--ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);--font-display:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;--font-sans:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;--font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.label{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
a{color:var(--blue-ink)}
.app{min-height:100svh;display:grid;grid-template-columns:minmax(300px,42%) minmax(0,1fr);background:radial-gradient(60% 50% at 0% 0%,rgba(149,254,124,.08),transparent 70%),radial-gradient(60% 50% at 100% 100%,rgba(126,193,251,.08),transparent 70%),var(--bg)}
/* DJ Wavy stage */
.wavy{position:relative;background:radial-gradient(70% 55% at 50% 62%,rgba(149,254,124,.12),transparent 70%),var(--stage);display:grid;grid-template-rows:auto 1fr auto;min-height:100svh;overflow:hidden}
.brand{padding:var(--space-5) var(--space-5) 0}.brand img{height:34px;width:auto;display:block}
model-viewer{width:100%;height:100%;min-height:360px;--poster-color:transparent;background:transparent;outline:none}
.floor{position:absolute;left:50%;bottom:132px;width:62%;aspect-ratio:3/1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(149,254,124,.28),transparent 72%);pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-muted);transition:opacity var(--dur-slow) var(--ease-out)}.loading.gone{opacity:0}
.tag{padding:var(--space-4) var(--space-5) var(--space-5);display:grid;gap:var(--space-2)}
.tag b{font:700 28px var(--font-display);letter-spacing:-.01em}
.speak{display:flex;gap:5px;align-items:center;height:22px}.speak i{width:4px;height:6px;border-radius:2px;background:var(--green);opacity:.55;transform-origin:center}
.is-speaking .speak i{animation:eq 1.1s ease-in-out infinite;opacity:1;box-shadow:0 0 10px rgba(149,254,124,.5)}.speak i:nth-child(2n){animation-delay:-.3s}.speak i:nth-child(3n){animation-delay:-.6s}.speak i:nth-child(5n){animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(3.2)}}
/* content */
.main{display:grid;grid-template-rows:auto 1fr auto;min-height:100svh;padding:var(--space-5) var(--space-6)}
.top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4)}
.rail{display:grid;gap:var(--space-2);flex:1;max-width:520px}.rail .segs{display:flex;gap:4px}.rail .segs i{flex:1;height:3px;border-radius:2px;background:rgba(218,236,253,.14);transition:background var(--dur-base)}.rail .segs i.done{background:var(--green)}.rail .segs i.now{background:var(--ink)}
.skip{background:none;border:0;color:var(--ink-muted);font:500 14px var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.skip:hover{color:var(--ink)}
.step{align-self:center;max-width:640px;width:100%;display:grid;gap:var(--space-4);animation:in var(--dur-slow) var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font:500 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink)}
h1,h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1}
h1{font-size:clamp(38px,5.4vw,64px)}h2{font-size:clamp(32px,4.4vw,52px)}h1 em{font-style:normal;color:var(--green-ink)}
.lead{font-size:18px;color:var(--ink);margin:0;max-width:56ch}.muted{color:var(--ink-muted)}
ul.pts{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-3)}
ul.pts li{display:grid;grid-template-columns:22px 1fr;gap:var(--space-3);font-size:17px;max-width:58ch}ul.pts li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:9px;justify-self:center;box-shadow:var(--glow-green)}
ol.pts{counter-reset:n;list-style:none;margin:0;padding:0;display:grid;gap:var(--space-4)}ol.pts li{counter-increment:n;display:grid;grid-template-columns:44px 1fr;gap:var(--space-3);font-size:17px;max-width:58ch;align-items:start}
ol.pts li::before{content:counter(n,decimal-leading-zero);font:500 14px var(--font-mono);color:var(--green-ink);padding-top:3px}
.note{font-size:14px;color:var(--ink-muted);max-width:58ch}.risk{font-size:14px;color:var(--danger);max-width:58ch}
/* lane choice */
.lanes{display:grid;gap:var(--space-3);margin-top:var(--space-2)}
.lane{display:grid;grid-template-columns:48px 1fr auto;gap:var(--space-4);align-items:center;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);cursor:pointer;font:inherit;transition:border-color var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast)}
.lane:hover{border-color:var(--green-ink);box-shadow:var(--glow-green);transform:translateX(4px)}.lane b{display:block;font:700 22px var(--font-display);color:var(--ink)}.lane span{color:var(--ink-muted);font-size:15px}.lane .arr{color:var(--green-ink);font-size:22px}
.lane .ico{width:48px;height:48px;border-radius:var(--radius-md);background:var(--stage);display:grid;place-items:center}
/* visuals */
.split{display:flex;height:16px;border-radius:var(--radius-pill);overflow:hidden;gap:2px}.split i{display:block}
.legend{display:grid;gap:var(--space-2);font-size:15px}.legend div{display:grid;grid-template-columns:14px 52px 1fr;gap:var(--space-3);align-items:center}.legend s{width:12px;height:12px;border-radius:50%;display:block}.legend b{font:700 15px var(--font-mono)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5)}.fig .n{font:600 clamp(44px,6vw,68px)/1 var(--font-display);letter-spacing:-.03em;color:var(--ink)}.fig .t{margin-top:var(--space-2);font-size:14px;color:var(--ink-muted);max-width:22ch}
.links{display:flex;flex-wrap:wrap;gap:var(--space-3)}
/* nav */
.bar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding-top:var(--space-5)}
.btn{font:700 15px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;height:52px;padding:0 var(--space-6);border-radius:var(--radius-lg);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-3);text-decoration:none;transition:box-shadow var(--dur-fast)}
.btn.p{background:var(--green);color:var(--on-green)}.btn.p:hover{box-shadow:var(--glow-green)}.btn.s{background:transparent;color:var(--blue-ink);border-color:var(--blue-ink)}.btn.s:hover{box-shadow:var(--glow-blue)}.btn.g{background:transparent;color:var(--ink-muted);border-color:var(--line);padding:0 var(--space-5)}.btn.g:hover{color:var(--ink)}
.btn[hidden]{display:none}
.check{display:flex;gap:var(--space-3);align-items:center;color:var(--ink-muted);font-size:14px}.check input{width:18px;height:18px;accent-color:#95fe7c}
@media(max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.wavy{min-height:0;height:min(46svh,420px);grid-template-rows:auto 1fr}.tag{position:absolute;left:0;right:0;bottom:0;padding:var(--space-5) var(--space-4) var(--space-3);background:linear-gradient(to top,rgba(2,2,2,.92) 35%,transparent)}.tag b{font-size:20px}.floor{bottom:60px}.main{min-height:0;padding:var(--space-4)}.figs{grid-template-columns:1fr}.brand{padding:var(--space-4) var(--space-4) 0}.lane{padding:var(--space-3) var(--space-4)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app" id="app">
 <aside class="wavy" id="wavy" aria-label="DJ Wavy">
  <div class="brand"><a href="index.html" aria-label="WaveWarz home"><img src="ChatGPT Image Oct 13, 2026, 07_12_16 PM.png" alt="WaveWarz"></a></div>
  <div style="position:relative;min-height:0"><div class="floor" aria-hidden="true"></div>
   <model-viewer id="mv" src="djwavy.glb" alt="DJ Wavy, the WaveWarz resident AI judge, in 3D. Drag to turn him." camera-controls disable-zoom disable-pan interaction-prompt="none" shadow-intensity="1" exposure="1.1" camera-orbit="-28deg 80deg 100%" min-camera-orbit="auto 60deg auto" max-camera-orbit="auto 100deg auto" interpolation-decay="120"></model-viewer>
   <div class="loading" id="loading"><span class="label">Loading DJ Wavy</span></div></div>
  <div class="tag"><div class="speak" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><b>DJ Wavy</b><div class="label">Resident AI judge &middot; drag to turn him</div></div></div>
 </aside>
 <main class="main">
  <div class="top"><div class="rail" id="rail" aria-live="polite"></div><button class="skip" id="skip" type="button">Skip to the end</button></div>
  <section class="step" id="step" aria-live="polite"></section>
  <div class="bar"><button class="btn g" id="back" type="button">Back</button><button class="btn p" id="next" type="button">Next <span aria-hidden="true">&rarr;</span></button></div>
 </main>
</div>
<script>
(function(){
 var ICON={trade:'<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 7.6h12.8M13.4 4.2l3.6 3.4-3.6 3.4" stroke="#95fe7c"/><path d="M20.2 16.4H7.4M10.6 13l-3.6 3.4 3.6 3.4" stroke="#7ec1fb"/></svg>',artist:'<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="7" r="3.4" stroke="#95fe7c"/><path d="M4.4 20.8c.8-4.1 3.4-6.2 6.6-6.2s5.8 2.1 6.6 6.2" stroke="#95fe7c"/><path d="M18.6 10.2l.75 1.7 1.85.2-1.4 1.3.4 1.8-1.6-.9-1.6.9.4-1.8-1.4-1.3 1.85-.2z" fill="#7ec1fb" stroke="none"/></svg>',host:'<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.6" cy="7" r="3.2" stroke="#95fe7c"/><path d="M3 20.8c.6-3.8 2.8-5.7 5.6-5.7 1.3 0 2.5.4 3.4 1.2" stroke="#95fe7c"/><path d="M13.8 13.2 20.4 10.8v6l-6.6-2.4z" fill="#7ec1fb" stroke="none"/><path d="M15.2 14.9v3.4" stroke="#7ec1fb"/><path d="M21.4 12.4a2.2 2.2 0 0 1 0 2.8" stroke="#daecfd" stroke-width="1.2"/></svg>'};
 var LANES={trader:{name:'Trader',ico:'trade',line:'Trade the songs you believe in.'},artist:{name:'Artist',ico:'artist',line:'Put your songs in battle. Earn on every trade.'},host:{name:'Host',ico:'host',line:'Launch your own Community Battle.'}};
 var CAM=['-28deg 80deg 100%','24deg 78deg 94%','-18deg 74deg 88%','34deg 82deg 98%','-6deg 76deg 92%','-34deg 78deg 96%','20deg 80deg 92%','0deg 78deg 102%'];
 var $=function(i){return document.getElementById(i)};
 function li(a){return '<ul class="pts">'+a.map(function(x){return '<li><span>'+x+'</span></li>'}).join('')+'</ul>'}
 function ol(a){return '<ol class="pts">'+a.map(function(x){return '<li><span>'+x+'</span></li>'}).join('')+'</ol>'}
 var SPLIT=[['Losing traders','50%','#7ec1fb'],['Winning traders','40%','#95fe7c'],['Winning artist','5%','#e5c25a'],['Losing artist','2%','#5fd3c1'],['Platform','3%','#989898']];
 var COMMON=[
  {k:'How a battle works',t:'Two songs. One clock.',h:'<p class="lead">Two artists battle on a timer. While it runs, you buy and sell tokens for either side. Prices move with the crowd, like any token.</p>'},
  {k:'How a battle works',t:'Every trade pays the artist.',h:'<p class="lead">1% of each trade goes straight to the artist on the side you traded, instantly and ONCHAIN. You can sell your tokens any time before the timer ends.</p>'},
  {k:'How a battle works',t:'Three votes pick the winner.',h:'<p class="lead">In Quick Battlez the winner is two of three: the fan poll, the charts, and me. I am DJ Wavy, the resident AI judge, and I cast one of the three votes.</p><p class="note">Main Events are won by the whole event, not round by round.</p>'},
  {k:'How a battle works',t:'Then the losing pool splits.',h:'<p class="lead">When the timer ends, the losing side’s pool is shared out like this.</p><div class="split" aria-hidden="true">'+SPLIT.map(function(s){return '<i style="width:'+s[1]+';background:'+s[2]+'"></i>'}).join('')+'</div><div class="legend">'+SPLIT.map(function(s){return '<div><s style="background:'+s[2]+'"></s><b>'+s[1]+'</b><span>'+s[0]+'</span></div>'}).join('')+'</div>'},
  {k:'How a battle works',t:'Nothing sends itself.',h:'<p class="lead">When a battle settles, tap <b>Withdraw</b> to collect your share. Traders are not paid automatically, so do not forget this last step.</p>'},
  {k:'Wallet setup',t:'Get a wallet.',h:li(['<b>Phantom</b> is recommended and <b>Solflare</b> also works.','On desktop, install the browser extension (Chrome).','To start, about <b>0.05 SOL</b> is plenty. You can buy SOL inside your wallet: tap SOL, then Buy.','On a phone, open wavewarz.com inside the Phantom or Solflare app browser.'])+'<div class="links"><a class="btn s" href="https://phantom.com" target="_blank" rel="noopener">Get Phantom</a><a class="btn s" href="https://solflare.com" target="_blank" rel="noopener">Get Solflare</a></div>'}
 ];
 var LANE={
  trader:[
   {k:'Trader',t:'Your three steps.',h:ol(['Connect your wallet.','Open a live battle. Buy or sell while the timer runs.','When it ends, tap <b>Withdraw</b>.'])},
   {k:'Trader',t:'How a trade can gain.',h:li(['Buy low, sell high. Trade the momentum while the timer runs.','Hold the winning side. Winning holders share the winning pool by how many tokens they hold.','Winning does not guarantee a gain. If you bought late, or hold a small share of the winning supply, your Withdraw can be less than you put in.'])},
   {k:'Trader',t:'How a trade can lose.',h:li(['Buy high, sell low. That is chasing a move after it already happened.','Hold the losing side into the finish. Part of that pool moves to the winner.','You can still come out ahead on the losing side if you bought very cheap and the price rose a lot.'])+'<p class="risk">You can lose what you put in. WaveWarz does not promise outcomes or returns. Start small.</p>'}
  ],
  artist:[
   {k:'Artist',t:'What artists earn.',h:'<div class="figs"><div class="fig"><div class="n">1%</div><div class="t">of every trade on your song</div></div><div class="fig"><div class="n">5%</div><div class="t">of the losing pool when you win</div></div><div class="fig"><div class="n">2%</div><div class="t">of the losing pool when you lose</div></div></div><p class="note">Trade payouts arrive instantly and automatically, ONCHAIN.</p>'},
   {k:'Artist',t:'Get your music ready.',h:li(['Upload your music to <b>audius.co</b>.','Make sure your tracks are public and playable, not paywalled or follow-walled.','In Africa, where Audius does not work, WaveWarz Africa uses SongChain instead.'])},
   {k:'Artist',t:'Queue your songs.',h:ol(['Use a desktop or laptop. This flow does not work on a phone.','Connect your wallet.','Go to Create Quick Battlez, connect your Audius profile, then queue your tracks.'])},
   {k:'Artist',t:'Then step up to Sunday.',h:'<p class="lead">Build a record in Quick Battlez and get on the leaderboard. Then tell us about yourself and we will curate your Main Event, Sundays at 7 PM Eastern.</p>'}
  ],
  host:[
   {k:'Host',t:'What hosts do.',h:'<p class="lead">Hosts launch Community Battlez: your own battle that runs as long as you choose, for example a day or three. Quick Battlez keep running alongside it.</p>'},
   {k:'Host',t:'Launch in three steps.',h:ol(['Connect your wallet.','Go to Community Battlez and launch a battle. You approve a few transactions in your wallet.','Tell your audience to tap <b>Withdraw</b> when it ends.'])+'<p class="note">Launching a Community Battle costs 0.017 SOL plus normal Solana network fees. You see the cost before your wallet opens.</p>'}
  ]};
 var FINAL={
  trader:{t:'You are ready to trade.',p:'Open the live battles, hear both songs, and start small.',cta:[['Open the live battles','https://www.wavewarz.com/quick-battles','p']]},
  artist:{t:'You are ready to battle.',p:'Connect your Audius profile, then queue your songs.',cta:[['Connect Audius profile','https://www.wavewarz.com/audius/connect','p'],['Create a Quick Battle','https://www.wavewarz.com/audius/search','s'],['Artist sign-up for Main Events','https://tally.so/r/wQZ5a7','s']]},
  host:{t:'You are ready to host.',p:'Launch your Community Battle when you are ready.',cta:[['Launch a Community Battle','https://www.wavewarz.com/v2/community/create','p']]}
 };
 var lane=null,idx=0,seq=[{welcome:true}],mv=$('mv'),speakT;
 function build(){seq=[{welcome:true}].concat(COMMON,lane?LANE[lane]:[],[{final:true}])}
 function speak(){var w=$('wavy');w.classList.add('is-speaking');clearTimeout(speakT);speakT=setTimeout(function(){w.classList.remove('is-speaking')},1600)}
 function rail(){var s=seq.length-1,h='<span class="label">'+(idx===0?'Welcome':(idx===seq.length-1?'Ready':'Step '+idx+' of '+(seq.length-2)+(lane?' · '+LANES[lane].name:'')))+'</span><div class="segs" aria-hidden="true">';for(var i=1;i<=s;i++)h+='<i class="'+(i<idx?'done':(i===idx?'now':''))+'"></i>';$('rail').innerHTML=h+'</div>'}
 function render(){
  var st=seq[idx],el=$('step'),h='';
  if(st.welcome){h='<div class="k">Welcome to WaveWarz</div><h1>I’m DJ Wavy. <em>Which lane are you in?</em></h1><p class="lead">Trade music battles live. Buy and sell while the timer runs. Withdraw at the end.</p><div class="lanes">'+Object.keys(LANES).map(function(k){return '<button class="lane" type="button" data-lane="'+k+'"><span class="ico">'+ICON[LANES[k].ico]+'</span><span><b>'+LANES[k].name+'</b><span>'+LANES[k].line+'</span></span><span class="arr" aria-hidden="true">&rarr;</span></button>'}).join('')+'</div>'}
  else if(st.final){var f=FINAL[lane];h='<div class="k">'+LANES[lane].name+' lane complete</div><h2>'+f.t+'</h2><p class="lead">'+f.p+'</p><div class="links">'+f.cta.map(function(c){return '<a class="btn '+c[2]+'" href="'+c[1]+'" target="_blank" rel="noopener">'+c[0]+'</a>'}).join('')+'</div><label class="check"><input type="checkbox" id="dont"> Do not show this automatically again</label><p class="note"><button class="skip" id="again" type="button">Pick a different lane</button> &middot; <button class="skip" id="replay" type="button">Replay from the start</button></p>'}
  else{h='<div class="k">'+st.k+'</div><h2>'+st.t+'</h2>'+st.h}
  el.innerHTML=h;el.style.animation='none';void el.offsetWidth;el.style.animation='';
  rail();
  $('back').hidden=idx===0;$('next').hidden=!!(st.welcome||st.final);$('skip').hidden=!!(st.final);
  var inCommon=idx>=1&&idx<=COMMON.length;$('skip').textContent=inCommon?'Skip the basics':'Skip to the end';
  mv.cameraOrbit=CAM[idx%CAM.length];speak();
 }
 function go(n){idx=Math.max(0,Math.min(seq.length-1,n));render();window.scrollTo(0,0)}
 document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.lane){lane=b.dataset.lane;build();go(1)}
  else if(b.id==='next')go(idx+1);else if(b.id==='back')go(idx-1);
  else if(b.id==='skip'){var inCommon=idx>=1&&idx<=COMMON.length;go(inCommon?COMMON.length+1:seq.length-1)}
  else if(b.id==='again'){lane=null;build();go(0)}else if(b.id==='replay'){go(1)}});
 document.addEventListener('change',function(e){if(e.target.id==='dont'){try{localStorage.setItem('ww-onboarding-hide',e.target.checked?'1':'')}catch(x){}}});
 document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input'))return;if(e.key==='ArrowRight'&&!$('next').hidden)go(idx+1);if(e.key==='ArrowLeft'&&idx>0)go(idx-1)});
 mv.addEventListener('load',function(){$('loading').classList.add('gone')});mv.addEventListener('error',function(){$('loading').innerHTML='<span class="label">DJ Wavy could not load. The guide still works.</span>'});
 render();
})();
</script>
</body></html>
